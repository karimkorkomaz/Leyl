<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEYL — Wear the night.</title>
    <meta name="description" content="LEYL, a perfume house from Beirut. Eau de Parfum in three editions: Anbar, Ward, Dukhan." />
    <meta name="theme-color" content="#0a0908" />
    <!-- Sharing. Set og:url and an absolute og:image once the production domain is known. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LEYL — Wear the night." />
    <meta property="og:description" content="A perfume house from Beirut, built around the city at night. Eau de Parfum in three editions: Anbar, Ward, Dukhan." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A LEYL perfume bottle glowing amber in a dark studio, the word LEYL behind it." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/amiri-arabic-subset.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Fetch the model alongside the JS, not after it. crossorigin matches three's same-origin fetch, so it is reused. -->
    <link rel="preload" href="/models/perfume_bottle.glb" as="fetch" crossorigin />
    <!-- Paint ink before any CSS arrives: no white flash -->
    <style>html, body { background: #0a0908; }</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;background:#0a0908;color:#ede6da;font-family:Georgia,serif">
        <div>
          <p style="font-size:2.5rem;letter-spacing:0.4em;margin:0 0 1rem">LEYL</p>
          <p style="font-style:italic;font-size:1.5rem;margin:0 0 2rem">Wear the night.</p>
          <p style="font-size:0.85rem;color:#8a8378;margin:0">This site is a 3D experience and needs JavaScript.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
